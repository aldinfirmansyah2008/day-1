<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Royal Chess — Cinematic Edition</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

html{
    background:#111;
}

body{

    min-height:100vh;

    font-family:Georgia,serif;

    color:#fff;

    display:flex;

    justify-content:center;

    padding:
        5px 0 25px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #858585 0%,
            #555 28%,
            #292929 65%,
            #111 100%
        );

    overflow-x:hidden;

}


/* =========================================================
   GAME
========================================================= */

.game{

    width:100%;

    max-width:900px;

    text-align:center;

}


/* =========================================================
   TITLE
========================================================= */

h1{

    font-size:
        clamp(30px,7vw,55px);

    margin:
        3px 0 1px;

    color:#f5f5f5;

    letter-spacing:2px;

    text-shadow:
        0 4px 4px #000,
        0 0 15px rgba(255,255,255,.25);

}


.subtitle{

    color:#d8d8d8;

    font-size:
        clamp(11px,3vw,15px);

    margin-bottom:9px;

}


/* =========================================================
   CAMERA AREA
========================================================= */

.camera{

    width:100%;

    display:flex;

    justify-content:center;

    overflow:visible;

}


/* =========================================================
   CAMERA VIEW
========================================================= */

.camera-view{

    position:relative;

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    transform-origin:center center;

    will-change:
        transform;

}


/* =========================================================
   CAMERA CINEMATIC ZOOM
========================================================= */

.camera-view.camera-zoom{

    animation:
        cameraZoom
        .9s
        cubic-bezier(
            .16,
            .75,
            .25,
            1
        );

}


@keyframes cameraZoom{

    0%{

        transform:
            scale(1)
            translate3d(0,0,0);

    }

    28%{

        transform:
            scale(1.055)
            translate3d(0,-4px,0);

    }

    55%{

        transform:
            scale(1.075)
            translate3d(0,-6px,0);

    }

    78%{

        transform:
            scale(1.045)
            translate3d(0,-3px,0);

    }

    100%{

        transform:
            scale(1)
            translate3d(0,0,0);

    }

}


/* =========================================================
   BOARD
========================================================= */

.board{

    position:relative;

    width:
        min(
            calc(100vw - 6px),
            820px
        );

    height:
        min(
            calc(100vw - 6px),
            820px
        );

    margin:0 auto;

    display:grid;

    grid-template-columns:
        repeat(8,1fr);

    grid-template-rows:
        repeat(8,1fr);

    border:
        5px solid #0c0c0c;

    border-radius:11px;

    overflow:hidden;

    background:#111;

    box-shadow:

        0 22px 50px
        rgba(0,0,0,.9),

        0 5px 0
        #777,

        0 0 30px
        rgba(0,0,0,.7);

}


/* =========================================================
   CINEMATIC VIGNETTE
========================================================= */

.board::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:100;

    opacity:0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.35) 100%
        );

}


.board.camera-active::after{

    animation:
        cinematicVignette
        .9s
        ease-out;

}


@keyframes cinematicVignette{

    0%{
        opacity:0;
    }

    25%{
        opacity:.65;
    }

    70%{
        opacity:.42;
    }

    100%{
        opacity:0;
    }

}


/* =========================================================
   SQUARE
========================================================= */

.square{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    overflow:hidden;

    user-select:none;

    touch-action:manipulation;

    -webkit-tap-highlight-color:
        transparent;

}


/* =========================================================
   LIGHT
========================================================= */

.light{

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #e4e4e4 45%,
            #cfcfcf 100%
        );

}


/* =========================================================
   DARK
========================================================= */

.dark{

    background:
        linear-gradient(
            145deg,
            #3b3b3b 0%,
            #202020 55%,
            #111 100%
        );

}


/* =========================================================
   TEXTURE
========================================================= */

.square::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.07),
            transparent 40%,
            rgba(0,0,0,.12)
        );

    pointer-events:none;

}


/* =========================================================
   PIECE
========================================================= */

.piece{

    width:95%;

    height:95%;

    object-fit:contain;

    position:relative;

    z-index:5;

    pointer-events:none;

    transform-origin:
        center bottom;

    will-change:
        transform,
        filter;

    transition:
        transform .18s ease,
        filter .18s ease;

}


/* =========================================================
   WHITE PIECE
========================================================= */

.white-piece{

    filter:

        drop-shadow(
            0 11px 5px
            rgba(0,0,0,.72)
        )

        drop-shadow(
            0 3px 2px
            rgba(0,0,0,.95)
        )

        brightness(1.08)

        contrast(1.08);

}


/* =========================================================
   BLACK PIECE
========================================================= */

.black-piece{

    filter:

        drop-shadow(
            0 11px 6px
            rgba(0,0,0,.95)
        )

        drop-shadow(
            0 3px 2px
            rgba(0,0,0,1)
        )

        brightness(.76)

        contrast(1.18);

}


/* =========================================================
   HOVER
========================================================= */

@media (hover:hover){

    .square:has(.piece):hover .piece{

        transform:
            translateY(-6px)
            scale(1.045);

        filter:
            drop-shadow(
                0 16px 8px
                rgba(0,0,0,.8)
            )
            brightness(1.12);

    }

}


/* =========================================================
   SELECTED
========================================================= */

.selected{

    box-shadow:

        inset
        0 0 0 4px
        rgba(255,255,255,.95),

        inset
        0 0 28px
        rgba(255,255,255,.3);

}


/* =========================================================
   POSSIBLE MOVE
========================================================= */

.possible::after{

    content:"";

    position:absolute;

    width:19%;

    height:19%;

    left:40.5%;

    top:40.5%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #777,
            #333
        );

    box-shadow:
        0 0 9px
        rgba(255,255,255,.8);

    z-index:3;

}


/* =========================================================
   CAPTURE TARGET
========================================================= */

.capture::after{

    content:"";

    position:absolute;

    inset:5px;

    border:
        4px solid
        rgba(255,255,255,.85);

    border-radius:50%;

    box-shadow:

        0 0 10px
        rgba(255,255,255,.25),

        inset
        0 0 12px
        rgba(0,0,0,.35);

    z-index:3;

}


/* =========================================================
   CHECK
========================================================= */

.check{

    animation:
        checkFlash
        .55s
        infinite alternate;

}


@keyframes checkFlash{

    from{

        box-shadow:
            inset
            0 0 0 3px
            rgba(255,255,255,.3);

    }

    to{

        box-shadow:
            inset
            0 0 0 8px
            rgba(255,255,255,.95),

            inset
            0 0 25px
            rgba(255,255,255,.25);

    }

}


/* =========================================================
   FLYING PIECE
========================================================= */

.flying-piece{

    position:fixed;

    z-index:99999;

    pointer-events:none;

    object-fit:contain;

    transform-origin:
        center bottom;

    will-change:
        left,
        top,
        transform;

    filter:

        drop-shadow(
            0 20px 10px
            rgba(0,0,0,.8)
        )

        drop-shadow(
            0 4px 2px
            rgba(0,0,0,1)
        );

}


/* =========================================================
   FLYING SHADOW
========================================================= */

.flying-piece-shadow{

    position:fixed;

    z-index:99998;

    pointer-events:none;

    border-radius:50%;

    background:
        rgba(0,0,0,.65);

    filter:
        blur(7px);

    will-change:
        left,
        top,
        width,
        height,
        opacity;

}


/* =========================================================
   SOURCE
========================================================= */

.animating-source .piece{

    opacity:0;

}


/* =========================================================
   LANDING
========================================================= */

.landing{

    animation:
        realisticLanding
        .32s
        cubic-bezier(.18,.8,.2,1);

}


@keyframes realisticLanding{

    0%{

        transform:
            translateY(-12px)
            scale(1.06);

    }

    45%{

        transform:
            translateY(3px)
            scale(.96);

    }

    70%{

        transform:
            translateY(-2px)
            scale(1.02);

    }

    100%{

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   LANDING LIGHT
========================================================= */

.square.land-effect::after{

    content:"";

    position:absolute;

    width:80%;

    height:80%;

    left:10%;

    top:10%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.38),
            rgba(255,255,255,.12) 30%,
            transparent 72%
        );

    animation:
        landingGlow
        .5s
        ease-out;

    pointer-events:none;

    z-index:8;

}


@keyframes landingGlow{

    0%{

        transform:
            scale(.15);

        opacity:1;

    }

    100%{

        transform:
            scale(1.6);

        opacity:0;

    }

}


/* =========================================================
   CAPTURE EFFECT
========================================================= */

.square.capture-effect::before{

    content:"";

    position:absolute;

    width:30%;

    height:30%;

    left:35%;

    top:35%;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.85);

    animation:
        capturePulse
        .4s
        ease-out;

    z-index:20;

}


@keyframes capturePulse{

    0%{

        transform:scale(.4);

        opacity:1;

    }

    100%{

        transform:scale(2.8);

        opacity:0;

    }

}


/* =========================================================
   STATUS
========================================================= */

.info{

    width:
        min(
            calc(100vw - 6px),
            820px
        );

    margin:
        10px auto 0;

    padding:
        11px;

    border-radius:10px;

    background:
        linear-gradient(
            145deg,
            #5c5c5c,
            #242424
        );

    border:
        1px solid #707070;

    box-shadow:

        0 8px 20px
        rgba(0,0,0,.55),

        inset
        0 1px 0
        rgba(255,255,255,.1);

}


#status{

    font-size:
        clamp(14px,4vw,18px);

    font-weight:bold;

    color:#f5f5f5;

    text-shadow:
        0 2px 2px #000;

}


/* =========================================================
   BUTTONS
========================================================= */

.buttons{

    width:
        min(
            calc(100vw - 6px),
            820px
        );

    margin:
        10px auto 0;

    display:flex;

    justify-content:center;

    gap:7px;

    flex-wrap:wrap;

}


button{

    padding:
        9px 14px;

    border:
        1px solid #707070;

    border-radius:8px;

    background:
        linear-gradient(
            #5c5c5c,
            #191919
        );

    color:white;

    font-size:
        clamp(11px,3vw,14px);

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.5);

    transition:
        transform .15s ease,
        filter .15s ease,
        box-shadow .15s ease;

}


button:hover{

    transform:
        translateY(-2px);

    filter:
        brightness(1.18);

    box-shadow:
        0 7px 15px
        rgba(0,0,0,.6);

}


button:active{

    transform:
        scale(.94);

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:10px;

    color:#aaa;

    font-size:10px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    body{

        padding:
            3px 0 20px;

    }


    h1{

        font-size:
            clamp(29px,8vw,38px);

        margin-top:1px;

    }


    .subtitle{

        font-size:11px;

        margin-bottom:6px;

    }


    .board{

        width:
            calc(100vw - 4px);

        height:
            calc(100vw - 4px);

        max-width:none;

        max-height:none;

        border-width:4px;

        border-radius:8px;

    }


    .piece{

        width:96%;

        height:96%;

    }


    .info{

        width:
            calc(100vw - 4px);

        margin-top:8px;

        padding:9px;

    }


    #status{

        font-size:15px;

    }


    .buttons{

        width:
            calc(100vw - 4px);

        gap:5px;

    }


    button{

        padding:
            8px 10px;

        font-size:11px;

    }


    .footer{

        font-size:9px;

    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .camera-view.camera-zoom{

        animation:none;

    }

    .landing{

        animation:none;

    }

    .check{

        animation:none;

    }

}

</style>

</head>


<body>


<div class="game">


    <h1>
        ♛ ROYAL CHESS
    </h1>


    <p class="subtitle">
        Kamu ♔ vs Komputer ♚ • PV2 • CINEMATIC CAMERA
    </p>


    <!-- =====================================================
         CAMERA
    ====================================================== -->

    <div class="camera">

        <div
            id="cameraView"
            class="camera-view"
        >

            <div
                id="board"
                class="board"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div class="info">

        <div id="status">
            ♟ Giliran Kamu
        </div>

    </div>


    <!-- =====================================================
         BUTTONS
    ====================================================== -->

    <div class="buttons">

        <button id="newGameBtn">
            🔄 Game Baru
        </button>

        <button id="undoBtn">
            ↩️ Undo
        </button>

    </div>


    <p class="footer">
        Royal Chess • Cinematic Camera System
    </p>


</div>


<script>

/* =========================================================
   CHESS ENGINE
========================================================= */

if(typeof Chess === "undefined"){

    alert(
        "Chess engine gagal dimuat. Periksa koneksi internet."
    );

}


const game =
    new Chess();


const boardElement =
    document.getElementById("board");


const cameraView =
    document.getElementById("cameraView");


const statusElement =
    document.getElementById("status");


const newGameBtn =
    document.getElementById("newGameBtn");


const undoBtn =
    document.getElementById("undoBtn");


let selectedSquare =
    null;


let lastMove =
    null;


let thinking =
    false;


let animating =
    false;


let computerTimer =
    null;


/* =========================================================
   PIECE IMAGES
========================================================= */

const pieceImages = {

    w:{

        k:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_klt45.svg",

        q:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_qlt45.svg",

        r:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_rlt45.svg",

        b:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_blt45.svg",

        n:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_nlt45.svg",

        p:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_plt45.svg"

    },

    b:{

        k:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_kdt45.svg",

        q:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_qdt45.svg",

        r:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_rdt45.svg",

        b:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_bdt45.svg",

        n:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_ndt45.svg",

        p:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_pdt45.svg"

    }

};


/* =========================================================
   FALLBACK SYMBOL
========================================================= */

const symbols = {

    wk:"♔",
    wq:"♕",
    wr:"♖",
    wb:"♗",
    wn:"♘",
    wp:"♙",

    bk:"♚",
    bq:"♛",
    br:"♜",
    bb:"♝",
    bn:"♞",
    bp:"♟"

};


/* =========================================================
   SQUARE ELEMENT
========================================================= */

function getSquareElement(square){

    return document.querySelector(
        '[data-square="' +
        square +
        '"]'
    );

}


/* =========================================================
   CINEMATIC CAMERA
========================================================= */

function cinematicCamera(){

    cameraView.classList.remove(
        "camera-zoom"
    );


    boardElement.classList.remove(
        "camera-active"
    );


    /*
       Paksa browser mengulang animasi.
    */

    void cameraView.offsetWidth;


    cameraView.classList.add(
        "camera-zoom"
    );


    boardElement.classList.add(
        "camera-active"
    );


    setTimeout(
        function(){

            cameraView.classList.remove(
                "camera-zoom"
            );

            boardElement.classList.remove(
                "camera-active"
            );

        },
        950
    );

}


/* =========================================================
   RENDER BOARD
========================================================= */

function renderBoard(){

    boardElement.innerHTML =
        "";


    const position =
        game.board();


    for(
        let row = 0;
        row < 8;
        row++
    ){

        for(
            let col = 0;
            col < 8;
            col++
        ){

            const square =
                document.createElement("div");


            const file =
                String.fromCharCode(
                    97 + col
                );


            const rank =
                8 - row;


            const squareName =
                file + rank;


            square.className =
                "square " +
                (
                    (row + col) % 2 === 0
                    ? "light"
                    : "dark"
                );


            square.dataset.square =
                squareName;


            const piece =
                position[row][col];


            if(piece){

                createPiece(
                    square,
                    piece
                );

            }


            square.addEventListener(
                "click",
                function(){

                    handleSquareClick(
                        squareName
                    );

                }
            );


            boardElement.appendChild(
                square
            );

        }

    }


    highlightBoard();

}


/* =========================================================
   CREATE PIECE
========================================================= */

function createPiece(
    square,
    piece
){

    const img =
        document.createElement("img");


    img.className =
        "piece " +
        (
            piece.color === "w"
            ? "white-piece"
            : "black-piece"
        );


    img.src =
        pieceImages
        [piece.color]
        [piece.type];


    img.alt =
        piece.color +
        piece.type;


    img.draggable =
        false;


    img.onerror =
        function(){

            this.style.display =
                "none";


            const fallback =
                document.createElement("span");


            fallback.textContent =
                symbols[
                    piece.color +
                    piece.type
                ];


            fallback.style.fontSize =
                "80%";


            fallback.style.lineHeight =
                "1";


            fallback.style.position =
                "relative";


            fallback.style.zIndex =
                "5";


            fallback.style.color =
                piece.color === "w"
                ? "#fff"
                : "#050505";


            fallback.style.textShadow =
                piece.color === "w"
                ? "0 4px 4px #000"
                : "0 4px 4px #777";


            square.appendChild(
                fallback
            );

        };


    square.appendChild(
        img
    );

}


/* =========================================================
   HIGHLIGHT BOARD
========================================================= */

function highlightBoard(){

    document
        .querySelectorAll(".square")
        .forEach(
            function(square){

                square.classList.remove(
                    "selected",
                    "possible",
                    "capture",
                    "check"
                );

            }
        );


    if(selectedSquare){

        const selected =
            getSquareElement(
                selectedSquare
            );


        if(selected){

            selected.classList.add(
                "selected"
            );

        }


        const moves =
            game.moves({

                square:
                    selectedSquare,

                verbose:
                    true

            });


        moves.forEach(
            function(move){

                const target =
                    getSquareElement(
                        move.to
                    );


                if(!target){

                    return;

                }


                if(move.captured){

                    target.classList.add(
                        "capture"
                    );

                }else{

                    target.classList.add(
                        "possible"
                    );

                }

            }
        );

    }


    /* =====================================================
       CHECK
    ====================================================== */

    if(game.in_check()){

        const color =
            game.turn();


        const position =
            game.board();


        for(
            let row = 0;
            row < 8;
            row++
        ){

            for(
                let col = 0;
                col < 8;
                col++
            ){

                const piece =
                    position[row][col];


                if(
                    piece &&
                    piece.type === "k" &&
                    piece.color === color
                ){

                    const name =
                        String.fromCharCode(
                            97 + col
                        ) +
                        (8 - row);


                    const king =
                        getSquareElement(
                            name
                        );


                    if(king){

                        king.classList.add(
                            "check"
                        );

                    }

                }

            }

        }

    }

}


/* =========================================================
   CLICK HANDLER
========================================================= */

function handleSquareClick(
    square
){

    if(
        thinking ||
        animating
    ){

        return;

    }


    if(
        game.turn() !== "w"
    ){

        return;

    }


    /* =====================================================
       SELECT PIECE
    ====================================================== */

    if(!selectedSquare){

        const piece =
            game.get(square);


        if(
            piece &&
            piece.color === "w"
        ){

            selectedSquare =
                square;


            highlightBoard();

        }

        return;

    }


    /* =====================================================
       CHANGE SELECTION
    ====================================================== */

    const clickedPiece =
        game.get(square);


    if(
        clickedPiece &&
        clickedPiece.color === "w"
    ){

        selectedSquare =
            square;


        highlightBoard();

        return;

    }


    /* =====================================================
       CHECK LEGAL MOVE
    ====================================================== */

    const moves =
        game.moves({

            square:
                selectedSquare,

            verbose:
                true

        });


    const legalMove =
        moves.find(
            function(move){

                return move.to === square;

            }
        );


    if(!legalMove){

        selectedSquare =
            null;


        highlightBoard();

        return;

    }


    const from =
        selectedSquare;


    const to =
        square;


    selectedSquare =
        null;


    animatePhysicalMove(
        from,
        to,
        function(){

            const move =
                game.move({

                    from:
                        from,

                    to:
                        to,

                    promotion:
                        "q"

                });


            if(!move){

                renderBoard();

                updateStatus();

                return;

            }


            lastMove =
                move;


            renderBoard();

            updateStatus();


            if(!game.game_over()){

                thinking =
                    true;


                updateStatus();


                computerTimer =
                    setTimeout(
                        computerMove,
                        500
                    );

            }

        }
    );

}


/* =========================================================
   REALISTIC MOVE + CAMERA
========================================================= */

function animatePhysicalMove(
    from,
    to,
    callback
){

    const fromSquare =
        getSquareElement(from);


    const toSquare =
        getSquareElement(to);


    if(
        !fromSquare ||
        !toSquare
    ){

        callback();

        return;

    }


    const piece =
        fromSquare.querySelector(
            ".piece"
        );


    if(!piece){

        callback();

        return;

    }


    animating =
        true;


    /*
       Kamera mulai bergerak bersamaan
       dengan bidak.
    */

    cinematicCamera();


    const start =
        fromSquare.getBoundingClientRect();


    const end =
        toSquare.getBoundingClientRect();


    const clone =
        piece.cloneNode(true);


    clone.classList.remove(
        "piece"
    );


    clone.classList.add(
        "flying-piece"
    );


    const size =
        Math.min(
            start.width,
            start.height
        ) * .92;


    clone.style.width =
        size + "px";


    clone.style.height =
        size + "px";


    const startLeft =
        start.left +
        (start.width - size) / 2;


    const startTop =
        start.top +
        (start.height - size) / 2;


    const endLeft =
        end.left +
        (end.width - size) / 2;


    const endTop =
        end.top +
        (end.height - size) / 2;


    clone.style.left =
        startLeft + "px";


    clone.style.top =
        startTop + "px";


    clone.style.transform =
        "translateY(0) scale(1)";


    /* =====================================================
       SHADOW
    ====================================================== */

    const shadow =
        document.createElement("div");


    shadow.className =
        "flying-piece-shadow";


    const shadowStartWidth =
        size * .5;


    shadow.style.width =
        shadowStartWidth + "px";


    shadow.style.height =
        size * .14 + "px";


    shadow.style.left =
        (
            start.left +
            start.width / 2 -
            shadowStartWidth / 2
        ) + "px";


    shadow.style.top =
        (
            start.top +
            start.height * .79
        ) + "px";


    shadow.style.opacity =
        ".72";


    document.body.appendChild(
        shadow
    );


    document.body.appendChild(
        clone
    );


    fromSquare.classList.add(
        "animating-source"
    );


    /* =====================================================
       CAPTURE
    ====================================================== */

    const capturedPiece =
        toSquare.querySelector(
            ".piece"
        );


    if(capturedPiece){

        capturedPiece.style.opacity =
            "0";

    }


    /* =====================================================
       START MOVEMENT
    ====================================================== */

    requestAnimationFrame(
        function(){

            requestAnimationFrame(
                function(){

                    clone.style.left =
                        endLeft + "px";


                    clone.style.top =
                        endTop + "px";


                    clone.style.transform =
                        "translateY(-28px) scale(1.06)";


                    shadow.style.left =
                        (
                            end.left +
                            end.width / 2 -
                            size * .20
                        ) + "px";


                    shadow.style.top =
                        (
                            end.top +
                            end.height * .80
                        ) + "px";


                    shadow.style.width =
                        size * .40 + "px";


                    shadow.style.opacity =
                        ".35";

                }
            );

        }
    );


    /* =====================================================
       HIGH POINT
    ====================================================== */

    setTimeout(
        function(){

            clone.style.transform =
                "translateY(-36px) scale(1.08)";

        },
        220
    );


    /* =====================================================
       LANDING
    ====================================================== */

    setTimeout(
        function(){

            clone.style.transform =
                "translateY(0) scale(.98)";

        },
        410
    );


    /* =====================================================
       FINISH
    ====================================================== */

    setTimeout(
        function(){

            clone.remove();

            shadow.remove();


            fromSquare.classList.remove(
                "animating-source"
            );


            if(capturedPiece){

                toSquare.classList.add(
                    "capture-effect"
                );


                setTimeout(
                    function(){

                        toSquare.classList.remove(
                            "capture-effect"
                        );

                    },
                    450
                );

            }


            toSquare.classList.add(
                "landing",
                "land-effect"
            );


            setTimeout(
                function(){

                    toSquare.classList.remove(
                        "landing",
                        "land-effect"
                    );

                },
                500
            );


            animating =
                false;


            callback();

        },
        560
    );

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    if(game.is_checkmate()){

        statusElement.textContent =
            game.turn() === "w"
            ? "♚ Skakmat — Komputer Menang"
            : "♔ Skakmat — Kamu Menang";

        return;

    }


    if(game.is_stalemate()){

        statusElement.textContent =
            "🤝 Remis — Stalemate";

        return;

    }


    if(game.is_draw()){

        statusElement.textContent =
            "🤝 Permainan Remis";

        return;

    }


    if(game.in_check()){

        statusElement.textContent =
            game.turn() === "w"
            ? "⚠️ Skak! Giliran Kamu"
            : "⚠️ Skak! Komputer";

        return;

    }


    if(thinking){

        statusElement.textContent =
            "♚ Komputer berpikir...";

        return;

    }


    statusElement.textContent =
        game.turn() === "w"
        ? "♟ Giliran Kamu"
        : "♚ Giliran Komputer";

}


/* =========================================================
   AI VALUES
========================================================= */

const pieceValue = {

    p:100,

    n:320,

    b:330,

    r:500,

    q:900,

    k:20000

};


/* =========================================================
   EVALUATE
========================================================= */

function evaluateBoard(){

    let score = 0;


    const board =
        game.board();


    for(
        let row = 0;
        row < 8;
        row++
    ){

        for(
            let col = 0;
            col < 8;
            col++
        ){

            const piece =
                board[row][col];


            if(!piece){

                continue;

            }


            const value =
                pieceValue[
                    piece.type
                ];


            if(piece.color === "b"){

                score += value;

            }else{

                score -= value;

            }

        }

    }


    return score;

}


/* =========================================================
   MINIMAX PV2
========================================================= */

function minimax(
    depth,
    alpha,
    beta,
    maximizing
){

    if(
        depth === 0 ||
        game.game_over()
    ){

        return evaluateBoard();

    }


    const moves =
        game.moves();


    if(!moves.length){

        return evaluateBoard();

    }


    if(maximizing){

        let best =
            -Infinity;


        for(
            const move of moves
        ){

            game.move(move);


            const score =
                minimax(
                    depth - 1,
                    alpha,
                    beta,
                    false
                );


            game.undo();


            best =
                Math.max(
                    best,
                    score
                );


            alpha =
                Math.max(
                    alpha,
                    score
                );


            if(beta <= alpha){

                break;

            }

        }


        return best;

    }


    let best =
        Infinity;


    for(
        const move of moves
    ){

        game.move(move);


        const score =
            minimax(
                depth - 1,
                alpha,
                beta,
                true
            );


        game.undo();


        best =
            Math.min(
                best,
                score
            );


        beta =
            Math.min(
                beta,
                score
            );


        if(beta <= alpha){

            break;

        }

    }


    return best;

}


/* =========================================================
   COMPUTER
========================================================= */

function computerMove(){

    computerTimer =
        null;


    if(
        game.game_over() ||
        game.turn() !== "b"
    ){

        thinking =
            false;

        updateStatus();

        return;

    }


    thinking =
        true;


    updateStatus();


    const moves =
        game.moves({
            verbose:true
        });


    if(!moves.length){

        thinking =
            false;

        updateStatus();

        return;

    }


    let bestMove =
        null;


    let bestScore =
        -Infinity;


    for(
        const move of moves
    ){

        game.move(move);


        const score =
            minimax(
                1,
                -Infinity,
                Infinity,
                false
            );


        game.undo();


        if(
            score > bestScore ||
            (
                score === bestScore &&
                Math.random() < .25
            )
        ){

            bestScore =
                score;

            bestMove =
                move;

        }

    }


    if(!bestMove){

        thinking =
            false;

        updateStatus();

        return;

    }


    animatePhysicalMove(
        bestMove.from,
        bestMove.to,
        function(){

            const move =
                game.move({

                    from:
                        bestMove.from,

                    to:
                        bestMove.to,

                    promotion:
                        "q"

                });


            if(move){

                lastMove =
                    move;

            }


            renderBoard();


            thinking =
                false;


            updateStatus();

        }
    );

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    if(computerTimer){

        clearTimeout(
            computerTimer
        );

        computerTimer =
            null;

    }


    game.reset();


    selectedSquare =
        null;


    lastMove =
        null;


    thinking =
        false;


    animating =
        false;


    renderBoard();

    updateStatus();

}


/* =========================================================
   UNDO
========================================================= */

function undoMove(){

    if(
        thinking ||
        animating
    ){

        return;

    }


    if(computerTimer){

        clearTimeout(
            computerTimer
        );

        computerTimer =
            null;

    }


    if(
        game.history().length === 0
    ){

        return;

    }


    /*
       Hapus langkah komputer
       jika sudah dimainkan.
    */

    if(
        game.turn() === "w"
    ){

        game.undo();

    }


    /*
       Hapus langkah pemain.
    */

    if(
        game.history().length > 0
    ){

        game.undo();

    }


    selectedSquare =
        null;


    lastMove =
        null;


    thinking =
        false;


    renderBoard();

    updateStatus();

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

newGameBtn.addEventListener(
    "click",
    newGame
);


undoBtn.addEventListener(
    "click",
    undoMove
);


/* =========================================================
   START
========================================================= */

renderBoard();

updateStatus();

</script>
