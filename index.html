<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #17102d, #30145c, #120b22);
      color: white;
    }

    .game {
      width: 95%;
      max-width: 500px;
      padding: 25px;
      text-align: center;
      background: rgba(20, 15, 35, 0.95);
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(180, 80, 255, .35);
    }

    h1 {
      margin-top: 0;
      color: #ffd84d;
      text-shadow: 0 0 15px #ff9800;
    }

    .credits {
      margin: 15px 0;
      font-size: 20px;
    }

    .machine {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 25px 0;
    }

    .reel {
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      border-radius: 15px;
      font-size: 55px;
      box-shadow: inset 0 0 15px #999, 0 0 15px rgba(255,255,255,.2);
    }

    button {
      border: 0;
      padding: 15px 40px;
      border-radius: 50px;
      background: linear-gradient(45deg, #ff9800, #ffd000);
      color: #241300;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255,174,0,.35);
    }

    button:hover {
      transform: scale(1.05);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      min-height: 30px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .info {
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

  </div>
