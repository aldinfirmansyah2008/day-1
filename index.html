<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>HD Chess</title>

    <!-- Mesin aturan catur -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #263238,
                    #080b0f 70%
                );

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .game {

            width: 100%;

            max-width: 700px;

            text-align: center;

        }


        h1 {

            font-size: clamp(30px, 8vw, 48px);

            margin-bottom: 5px;

            text-shadow:
                0 0 10px #00e5ff,
                0 0 25px #00e5ff;

        }


        .subtitle {

            color: #b0bec5;

            margin-bottom: 20px;

        }


        /* =========================
           PAPAN
        ========================= */

        .board {

            width: min(94vw, 640px);

            aspect-ratio: 1 / 1;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(8, 1fr);

            border: 5px solid #263238;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 0 25px rgba(0, 229, 255, 0.3),
                0 15px 50px rgba(0, 0, 0, 0.7);

        }


        .square {

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;

            user-select: none;

        }


        .light {

            background:
                linear-gradient(
                    135deg,
                    #f4ead2,
                    #d9c9a5
                );

        }


        .dark {

            background:
                linear-gradient(
                    135deg,
                    #789b58,
                    #55743d
                );

        }


        .square:hover {

            filter: brightness(1.15);

        }


        /* =========================
           BIDAK
        ========================= */

        .piece {

            font-family:
                "Segoe UI Symbol",
                "Noto Sans Symbols",
                "DejaVu Sans",
                sans-serif;

            font-size:
                clamp(38px, 10vw, 72px);

            line-height: 1;

            position: relative;

            z-index: 5;

            pointer-events: none;

            transform-origin: center bottom;

            transition:
                filter 0.15s,
                transform 0.15s;

        }


        /*
           BIDAK PUTIH
        */

        .white-piece {

            color: #ffffff;

            text-shadow:

                0 2px 0 #aaa,

                0 4px 4px #555,

                0 7px 8px rgba(0,0,0,0.6),

                0 0 5px white;

        }


        /*
           BIDAK HITAM
        */

        .black-piece {

            color: #171717;

            text-shadow:

                0 1px 0 #777,

                0 3px 3px #000,

                0 6px 8px rgba(0,0,0,0.8),

                0 0 3px #aaa;

        }


        /* =========================
           ANIMASI BIDAK
        ========================= */

        .moving {

            animation:

                movePiece 0.35s
                cubic-bezier(.2,.8,.3,1);

        }


        @keyframes movePiece {

            0% {

                transform:
                    translateY(-18px)
                    scale(1.08);

            }

            45% {

                transform:
                    translateY(-8px)
                    scale(1.03);

            }

            100% {

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /*
           EFEK SAAT DIPILIH
        */

        .selected {

            box-shadow:
                inset 0 0 0 5px #00e5ff,
                inset 0 0 20px rgba(0,229,255,0.5);

        }


        /*
           LANGKAH YANG BISA DIPILIH
        */

        .possible::after {

            content: "";

            position: absolute;

            width: 22%;

            height: 22%;

            border-radius: 50%;

            background:
                rgba(0,0,0,0.35);

            box-shadow:
                0 0 8px rgba(255,255,255,0.3);

        }


        /*
           KOTAK BIDAK YANG BISA DIMAKAN
        */

        .capture::after {

            content: "";

            position: absolute;

            inset: 7px;

            border:
                5px solid
                rgba(180, 20, 20, 0.65);

            border-radius: 50%;

        }


        /* =========================
           EFEK SKAK
        ========================= */

        .check {

            animation:
                checkFlash 0.8s infinite alternate;

        }


        @keyframes checkFlash {

            from {

                box-shadow:
                    inset 0 0 0 4px
                    rgba(255,0,0,0.4);

            }

            to {

                box-shadow:
                    inset 0 0 0 8px
                    rgba(255,0,0,0.9);

            }

        }


        /* =========================
           STATUS
        ========================= */

        .info {

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.1);

            backdrop-filter: blur(10px);

        }


        #status {

            font-size: 20px;

            font-weight: bold;

        }


        /* =========================
           TOMBOL
        ========================= */

        .buttons {

            margin-top: 15px;

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

        }


        button {

            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background: #00acc1;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            background: #00e5ff;

            transform:
                translateY(-2px);

            box-shadow:
                0 5px 20px
                rgba(0,229,255,0.4);

        }


        .footer {

            margin-top: 20px;

            color: #78909c;

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="game">


    <h1>♛ HD CHESS</h1>


    <p class="subtitle">
        Permainan Catur
    </p>


    <!-- PAPAN CATUR -->

    <div
        id="board"
        class="board">
    </div>


    <!-- STATUS -->

    <div class="info">

        <div id="status">
            Giliran Putih
        </div>

    </div>


    <!-- TOMBOL -->

    <div class="buttons">

        <button onclick="newGame()">
            🔄 Game Baru
        </button>

        <button onclick="undoMove()">
            ↩️ Undo
        </button>

    </div>


    <p class="footer">

        HTML + CSS + JavaScript

    </p>


</div>



<script>


/* =========================
   MESIN CATUR
========================= */

const game = new Chess();


const boardElement =
    document.getElementById("board");


const statusElement =
    document.getElementById("status");


let selectedSquare = null;


/*
   Menyimpan langkah terakhir
*/

let lastMove = null;



/* =========================
   BIDAK CATUR
========================= */

const pieces = {

    w: {

        p: "♙",

        r: "♖",

        n: "♘",

        b: "♗",

        q: "♕",

        k: "♔"

    },

    b: {

        p: "♟",

        r: "♜",

        n: "♞",

        b: "♝",

        q: "♛",

        k: "♚"

    }

};



/* =========================
   BUAT PAPAN
========================= */

function drawBoard() {


    boardElement.innerHTML = "";


    const board =
        game.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {


        for (
            let col = 0;
            col < 8;
            col++
        ) {


            const square =
                document.createElement("div");


            /*
               Nama kotak:

               a8 b8 c8 ...
               a7 b7 c7 ...
            */

            const squareName =

                String.fromCharCode(
                    97 + col
                )

                +

                (8 - row);


            square.dataset.square =
                squareName;


            square.classList.add(
                "square"
            );


            /*
               WARNA PAPAN
            */

            if (
                (row + col) % 2 === 0
            ) {

                square.classList.add(
                    "light"
                );

            } else {

                square.classList.add(
                    "dark"
                );

            }


            /*
               BIDAK
            */

            const piece =
                board[row][col];


            if (piece) {


                const pieceElement =
                    document.createElement("span");


                pieceElement.classList.add(
                    "piece"
                );


                /*
                   Warna bidak
                */

                if (
                    piece.color === "w"
                ) {

                    pieceElement.classList.add(
                        "white-piece"
                    );

                } else {

                    pieceElement.classList.add(
                        "black-piece"
                    );

                }


                /*
                   Karakter bidak
                */

                pieceElement.textContent =
                    pieces[
                        piece.color
                    ][
                        piece.type
                    ];


                /*
                   Animasi langkah terakhir
                */

                if (
                    lastMove &&
                    lastMove.to === squareName
                ) {

                    pieceElement.classList.add(
                        "moving"
                    );

                }


                square.appendChild(
                    pieceElement
                );

            }


            /*
               Kotak yang dipilih
            */

            if (
                selectedSquare ===
                squareName
            ) {

                square.classList.add(
                    "selected"
                );

            }


            square.addEventListener(
                "click",
                function() {

                    handleSquareClick(
                        squareName
                    );

                }
            );


            boardElement.appendChild(
                square
            );

        }

    }


    showPossibleMoves();

    showCheck();

    updateStatus();

}



/* =========================
   KLIK KOTAK
========================= */

function handleSquareClick(square) {


    /*
       Belum memilih bidak
    */

    if (!selectedSquare) {


        const piece =
            game.get(square);


        /*
           Kotak kosong
        */

        if (!piece) {

            return;

        }


        /*
           Bukan giliran kita
        */

        if (
            piece.color !==
            game.turn()
        ) {

            return;

        }


        selectedSquare =
            square;


        drawBoard();


        return;

    }



    /*
       Coba melakukan langkah
    */

    const move =
        game.move({

            from:
                selectedSquare,

            to:
                square,

            promotion:
                "q"

        });



    /*
       Langkah berhasil
    */

    if (move) {


        lastMove = move;


        selectedSquare =
            null;


        drawBoard();


    }

    else {


        /*
           Jika klik bidak sendiri,
           pindahkan pilihan
        */

        const piece =
            game.get(square);


        if (
            piece &&
            piece.color ===
            game.turn()
        ) {

            selectedSquare =
                square;


            drawBoard();

        }

    }

}



/* =========================
   LANGKAH YANG TERSEDIA
========================= */

function showPossibleMoves() {


    if (!selectedSquare) {

        return;

    }


    const moves =
        game.moves({

            square:
                selectedSquare,

            verbose:
                true

        });


    moves.forEach(
        function(move) {


            const element =
                document.querySelector(
                    `[data-square="${move.to}"]`
                );


            if (!element) {

                return;

            }


            /*
               Kalau ada bidak lawan
            */

            if (
                game.get(move.to)
            ) {

                element.classList.add(
                    "capture"
                );

            }

            else {

                element.classList.add(
                    "possible"
                );

            }

        }
    );

}



/* =========================
   TANDA SKAK
========================= */

function showCheck() {


    if (!game.in_check()) {

        return;

    }


    /*
       Cari raja yang sedang skak
    */

    const color =
        game.turn();


    const board =
        game.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {


        for (
            let col = 0;
            col < 8;
            col++
        ) {


            const piece =
                board[row][col];


            if (
                piece &&
                piece.type === "k" &&
                piece.color === color
            ) {


                const squareName =

                    String.fromCharCode(
                        97 + col
                    )

                    +

                    (8 - row);


                const element =
                    document.querySelector(
                        `[data-square="${squareName}"]`
                    );


                if (element) {

                    element.classList.add(
                        "check"
                    );

                }

            }

        }

    }

}



/* =========================
   STATUS
========================= */

function updateStatus() {


    let text = "";


    /*
       SKAKMAT
    */

    if (
        game.in_checkmate()
    ) {


        const winner =
            game.turn() === "w"
                ? "Hitam"
                : "Putih";


        text =
            "🏆 " +
            winner +
            " menang — SKAKMAT!";

    }


    /*
       SERI
    */

    else if (
        game.in_draw()
    ) {

        text =
            "🤝 Permainan Seri";

    }


    /*
       PERMAINAN SELESAI
    */

    else if (
        game.game_over()
    ) {

        text =
            "Permainan selesai";

    }


    /*
       PERMAINAN BERJALAN
    */

    else {


        const turn =
            game.turn() === "w"
                ? "Putih"
                : "Hitam";


        text =
            "Giliran " +
            turn;


        if (
            game.in_check()
        ) {

            text +=
                " — ⚠️ SKAK!";

        }

    }


    statusElement.textContent =
        text;

}



/* =========================
   GAME BARU
========================= */

function newGame() {


    game.reset();


    selectedSquare =
        null;


    lastMove =
        null;


    drawBoard();

}



/* =========================
   UNDO
========================= */

function undoMove() {


    game.undo();


    selectedSquare =
        null;


    lastMove =
        null;


    drawBoard();

}



/* =========================
   MULAI GAME
========================= */

drawBoard();


</script>


</body>

</html>
