<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Arcade</title>

  <style>
    * {
      box-sizing: border-box;
    }
  body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at top, #5b167d, transparent 45%),
        linear-gradient(135deg, #12091e, #32104f, #090610);

      color: white;
    }

    /* =========================
       CONTAINER
    ========================= */
<div class="container">
    .container {
      width: 100%;
      max-width: 520px;
    }

    .box {
      width: 100%;
      padding: 25px;

      background: rgba(18, 12, 30, 0.97);

      border: 2px solid #8050a5;
      border-radius: 25px;

      box-shadow:
        0 0 30px rgba(190, 80, 255, .3),
        0 20px 60px rgba(0, 0, 0, .6);
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGO
    ========================= */

    h1 {
      margin: 0;
      text-align: center;

      color: #ffd84d;

      font-size: 34px;

      text-shadow:
        0 0 10px #ff9800,
        0 0 25px #ff9800;
    }

    .subtitle {
      margin-top: 6px;

      text-align: center;

      color: #aaa;

      font-size: 11px;

      letter-spacing: 1px;
    }

    /* =========================
       FORM
    ========================= */

    .tabs {
      display: flex;
      gap: 8px;

      margin-top: 25px;
      margin-bottom: 18px;
    }

    .tab {
      flex: 1;

      padding: 12px;

      border: 1px solid #65437d;
      border-radius: 12px;

      background: #21152c;

      color: #aaa;

      cursor: pointer;

      font-weight: bold;
    }

    .tab.active {
      background: #5b2c78;
      color: #ffd84d;

      border-color: #b66ce0;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid #65437d;
      border-radius: 12px;

      background: #0d0915;

      color: white;

      outline: none;

      font-size: 15px;
    }

    input:focus {
      border-color: #ffd84d;

      box-shadow:
        0 0 10px rgba(255, 216, 77, .2);
    }

    .main-button {
      width: 100%;

      padding: 14px;

      border: none;
      border-radius: 12px;

      background:
        linear-gradient(45deg, #ff9800, #ffd000);

      color: #241300;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    .main-button:hover {
      filter: brightness(1.08);
    }

    .error {
      min-height: 22px;

      margin-top: 12px;

      text-align: center;

      color: #ff7777;

      font-size: 13px;
    }

    .success {
      color: #71ff9c;
    }

    .info {
      margin-top: 18px;

      text-align: center;

      color: #777;

      font-size: 11px;

      line-height: 1.5;
    }

    /* =========================
       PLAYER BAR
    ========================= */

    .player-bar {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 10px;

      margin-top: 20px;

      padding: 10px 12px;

      background: #0d0917;

      border: 1px solid #ffffff15;

      border-radius: 12px;
    }

    .player-name {
      color: #ffd84d;

      font-weight: bold;
    }

    .logout-button {
      padding: 8px 12px;

      border: 1px solid #65437d;
      border-radius: 10px;

      background: #241833;

      color: white;

      cursor: pointer;
    }

    /* =========================
       CREDITS
    ========================= */

    .credits {
      margin: 15px 0;

      padding: 13px;

      text-align: center;

      border-radius: 12px;

      background: #0d0917;

      border: 1px solid #ffffff15;

      font-size: 20px;
    }

    .credits strong {
      color: #ffd84d;
    }
