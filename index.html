<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Royal HD Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    font-family:Georgia,serif;

    color:white;

    display:flex;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #5d4520,
            #17120a 45%,
            #050505 100%
        );
}

.game{
    width:100%;
    max-width:720px;

    text-align:center;
}

h1{
    font-size:clamp(32px,8vw,54px);

    margin-top:10px;
    margin-bottom:5px;

    color:#f8d77a;

    text-shadow:
        0 2px 3px #000,
        0 0 15px rgba(255,210,70,.55);
}

.subtitle{
    color:#d8c28a;
    margin-bottom:18px;
}

/* =========================
   PAPAN
========================= */

.board{

    width:min(94vw,680px);

    aspect-ratio:1;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(8,1fr);

    border:10px solid #4a3014;

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 15px 45px rgba(0,0,0,.8),
        0 0 30px rgba(255,190,60,.2);
}

.square{

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    overflow:hidden;
}

.light{

    background:
        linear-gradient(
            135deg,
            #f5e6bd,
            #c9aa70
        );
}

.dark{

    background:
        linear-gradient(
            135deg,
            #80613a,
            #4d3218
        );
}

.square:hover{
    filter:brightness(1.13);
}

/* =========================
   BIDAK REALISTIS
========================= */

.piece{

    width:88%;
    height:88%;

    object-fit:contain;

    position:relative;

    z-index:5;

    pointer-events:none;

    transform-origin:center bottom;

    filter:
        drop-shadow(
            0 5px 3px rgba(0,0,0,.75)
        );

    transition:
        transform .18s ease,
        filter .18s ease;
}

.white-piece{

    filter:
        drop-shadow(
            0 4px 2px rgba(0,0,0,.8)
        )
        drop-shadow(
            0 0 3px rgba(255,255,255,.7)
        );
}

.black-piece{

    filter:
        drop-shadow(
            0 5px 3px rgba(0,0,0,.95)
        )
        brightness(.82)
        contrast(1.15);
}

/* Animasi gerakan */

.moving{

    animation:
        pieceMove .38s
        cubic-bezier(.2,.8,.3,1);
}

@keyframes pieceMove{

    0%{
        transform:
            translateY(-22px)
            scale(1.08);
    }

    45%{
        transform:
            translateY(-7px)
            scale(1.03);
    }

    100%{
        transform:
            translateY(0)
            scale(1);
    }
}

/* Bidak saat dipilih */

.selected{

    box-shadow:
        inset 0 0 0 5px #f7d35b,
        inset 0 0 25px
        rgba(255,210,70,.55);
}

/* Langkah tersedia */

.possible::after{

    content:"";

    position:absolute;

    width:22%;
    height:22%;

    border-radius:50%;

    background:
        rgba(30,20,5,.5);

    box-shadow:
        0 0 8px
        rgba(255,230,120,.5);
}

/* Bisa makan */

.capture::after{

    content:"";

    position:absolute;

    inset:7px;

    border:
        5px solid
        rgba(170,30,20,.7);

    border-radius:50%;
}

/* SKAK */

.check{

    animation:
        checkFlash .7s
        infinite alternate;
}

@keyframes checkFlash{

    from{
        box-shadow:
            inset 0 0 0 4px
            rgba(255,0,0,.35);
    }

    to{
        box-shadow:
            inset 0 0 0 8px
            rgba(255,30,30,.9);
    }
}

/* =========================
   STATUS
========================= */

.info{

    margin-top:18px;

    padding:16px;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            rgba(100,70,25,.55),
            rgba(20,15,8,.85)
        );

    border:
        1px solid
        rgba(255,215,100,.25);

    box-shadow:
        0 8px 25px rgba(0,0,0,.4);
}

#status{

    font-size:20px;

    font-weight:bold;

    color:#f8d77a;
}

/* =========================
   BUTTON
========================= */

.buttons{

    margin-top:14px;

    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;
}

button{

    padding:12px 19px;

    border:none;

    border-radius:9px;

    background:
        linear-gradient(
            #d9a62e,
            #815719
        );

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.4);
}

button:hover{

    transform:translateY(-2px);

    filter:brightness(1.15);
}

button:active{

    transform:scale(.96);
}

.footer{

    margin-top:17px;

    color:#9e8c67;

    font-size:12px;
}

@media(max-width:500px){

    body{
        padding:10px;
    }

    .board{
        border-width:6px;
    }

    .piece{
        width:94%;
        height:94%;
    }

}

</style>
</head>


<body>

<div class="game">

<h1>♛ ROYAL CHESS</h1>

<p class="subtitle">
    Kamu ♔ vs Komputer ♚
</p>


<div id="board" class="board"></div>


<div class="info">

<div id="status">
    Giliran Putih
</div>

</div>


<div class="buttons">

<button onclick="newGame()">
    🔄 Game Baru
</button>

<button onclick="undoMove()">
    ↩️ Undo
</button>

<button onclick="toggleMusic()">
    🎵 Musik Kerajaan
</button>

</div>


<p class="footer">
    Royal Chess • HTML + CSS + JavaScript
</p>

</div>


<script>

/* =====================================================
   MESIN CATUR
===================================================== */

const game = new Chess();

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

let selectedSquare = null;

let lastMove = null;

let thinking = false;


/* =====================================================
   GAMBAR BIDAK SVG
===================================================== */

/*
   Nama file:
   k = king
   q = queen
   r = rook
   b = bishop
   n = knight
   p = pawn

   l = light / putih
   d = dark / hitam
*/

const pieceImages = {

    w:{
        k:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_klt45.svg",
        q:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_qlt45.svg",
        r:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_rlt45.svg",
        b:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_blt45.svg",
        n:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_nlt45.svg",
        p:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_plt45.svg"
    },

    b:{
        k:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_kdt45.svg",
        q:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_qdt45.svg",
        r:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_rdt45.svg",
        b:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_bdt45.svg",
        n:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_ndt45.svg",
        p:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_pdt45.svg"
    }

};


/* =====================================================
   BUAT PAPAN
===================================================== */

function drawBoard(){

    boardElement.innerHTML="";

    const board =
        game.board();

    for(let row=0;row<8;row++){

        for(let col=0;col<8;col++){

            const square =
                document.createElement("div");

            const squareName =
                String.fromCharCode(97+col)
                +
                (8-row);

            square.dataset.square =
                squareName;

            square.classList.add("square");


            if((row+col)%2===0){

                square.classList.add("light");

            }else{

                square.classList.add("dark");

            }


            const piece =
                board[row][col];


            if(piece){

                const img =
                    document.createElement("img");

                img.classList.add("piece");

                img.classList.add(
                    piece.color==="w"
                    ? "white-piece"
                    : "black-piece"
                );

                img.src =
                    pieceImages[
                        piece.color
                    ][
                        piece.type
                    ];

                img.alt =
                    piece.type;


                if(
                    lastMove &&
                    lastMove.to === squareName
                ){

                    img.classList.add("moving");

                }


                square.appendChild(img);

            }


            if(
                selectedSquare ===
                squareName
            ){

                square.classList.add(
                    "selected"
                );

            }


            square.addEventListener(
                "click",
                ()=>{
                    handleSquareClick(
                        squareName
                    );
                }
            );


            boardElement.appendChild(
                square
            );

        }

    }


    showPossibleMoves();

    showCheck();

    updateStatus();

}


/* =====================================================
   KLIK BIDAK
===================================================== */

function handleSquareClick(square){

    if(thinking)
        return;


    /*
       Komputer = HITAM
       Pemain = PUTIH
    */

    if(game.turn() !== "w")
        return;


    if(!selectedSquare){

        const piece =
            game.get(square);

        if(!piece)
            return;

        if(piece.color !== "w")
            return;

        selectedSquare =
            square;

        drawBoard();

        return;
    }


    const move =
        game.move({

            from:selectedSquare,

            to:square,

            promotion:"q"

        });


    if(move){

        lastMove =
            move;

        selectedSquare =
            null;

        drawBoard();

        if(!game.game_over()){

            setTimeout(
                computerMove,
                350
            );

        }

    }else{

        const piece =
            game.get(square);

        if(
            piece &&
            piece.color === "w"
        ){

            selectedSquare =
                square;

            drawBoard();

        }

    }

}


/* =====================================================
   LANGKAH TERSEDIA
===================================================== */

function showPossibleMoves(){

    if(!selectedSquare)
        return;


    const moves =
        game.moves({

            square:selectedSquare,

            verbose:true

        });


    moves.forEach(move=>{

        const element =
            document.querySelector(
                `[data-square="${move.to}"]`
            );

        if(!element)
            return;


        if(game.get(move.to)){

            element.classList.add(
                "capture"
            );

        }else{

            element.classList.add(
                "possible"
            );

        }

    });

}


/* =====================================================
   SKAK
===================================================== */

function showCheck(){

    if(!game.in_check())
        return;


    const color =
        game.turn();

    const board =
        game.board();


    for(let row=0;row<8;row++){

        for(let col=0;col<8;col++){

            const piece =
                board[row][col];

            if(
                piece &&
                piece.type==="k" &&
                piece.color===color
            ){

                const name =
                    String.fromCharCode(97+col)
                    +
                    (8-row);

                const element =
                    document.querySelector(
                        `[data-square="${name}"]`
                    );

                if(element){

                    element.classList.add(
                        "check"
                    );

                }

            }

        }

    }

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(){

    let text="";


    if(game.in_checkmate()){

        const winner =
            game.turn()==="w"
            ? "Komputer"
            : "Kamu";

        text =
            "🏆 " +
            winner +
            " menang — SKAKMAT!";

    }

    else if(game.in_draw()){

        text =
            "🤝 Permainan seri";

    }

    else{

        const turn =
            game.turn()==="w"
            ? "Kamu"
            : "Komputer";

        text =
            "♟ Giliran " +
            turn;

        if(game.in_check()){

            text +=
                " — ⚠️ SKAK!";

        }

    }


    statusElement.textContent =
        text;

}


/* =====================================================
   NILAI BIDAK
===================================================== */

const values = {

    p:100,

    n:320,

    b:330,

    r:500,

    q:900,

    k:20000

};


/* =====================================================
   EVALUASI
===================================================== */

function evaluate(){

    const board =
        game.board();

    let score=0;


    for(const row of board){

        for(const piece of row){

            if(!piece)
                continue;

            const value =
                values[piece.type];

            if(piece.color==="b"){

                score += value;

            }else{

                score -= value;

            }

        }

    }


    return score;
}


/* =====================================================
   MINIMAX KOMPUTER
===================================================== */

function minimax(
    depth,
    alpha,
    beta,
    maximizing
){

    if(depth===0 ||
       game.game_over()){

        return evaluate();

    }


    const moves =
        game.moves();


    if(maximizing){

        let best =
            -Infinity;


        for(const move of moves){

            game.move(move);

            const score =
                minimax(
                    depth-1,
                    alpha,
                    beta,
                    false
                );

            game.undo();


            best =
                Math.max(
                    best,
                    score
                );

            alpha =
                Math.max(
                    alpha,
                    score
                );

            if(beta<=alpha)
                break;

        }


        return best;

    }else{

        let best =
            Infinity;


        for(const move of moves){

            game.move(move);

            const score =
                minimax(
                    depth-1,
                    alpha,
                    beta,
                    true
                );

            game.undo();


            best =
                Math.min(
                    best,
                    score
                );

            beta =
                Math.min(
                    beta,
                    score
                );

            if(beta<=alpha)
                break;

        }


        return best;

    }

}


/* =====================================================
   KOMPUTER BERMAIN
===================================================== */

function computerMove(){

    if(
        game.game_over() ||
        game.turn()!=="b"
    ){

        return;

    }


    thinking=true;

    statusElement.textContent =
        "🤖 Komputer sedang berpikir...";


    setTimeout(()=>{

        const moves =
            game.moves();


        if(!moves.length){

            thinking=false;

            drawBoard();

            return;

        }


        let bestMove =
            null;

        let bestScore =
            -Infinity;


        /*
           Depth 2:
           cukup ringan untuk HP.

           Kalau HP kamu kuat,
           bisa ubah 2 menjadi 3.
        */

        for(const move of moves){

            game.move(move);

            const score =
                minimax(
                    2,
                    -Infinity,
                    Infinity,
                    false
                );

            game.undo();


            /*
               Sedikit variasi supaya
               komputer tidak selalu
               memainkan langkah identik.
            */

            const randomBonus =
                Math.random()*3;


            if(
                score + randomBonus
                >
                bestScore
            ){

                bestScore =
                    score +
                    randomBonus;

                bestMove =
                    move;

            }

        }


        if(bestMove){

            const played =
                game.move(bestMove);

            lastMove =
                played;

        }


        thinking=false;

        drawBoard();

    },250);

}


/* =====================================================
   GAME BARU
===================================================== */

function newGame(){

    game.reset();

    selectedSquare =
        null;

    lastMove =
        null;

    thinking=false;

    drawBoard();

}


/* =====================================================
   UNDO
===================================================== */

function undoMove(){

    if(thinking)
        return;


    /*
       Undo langkah komputer
       kemudian undo langkah pemain.
    */

    game.undo();

    if(game.history().length){

        game.undo();

    }


    selectedSquare =
        null;

    lastMove =
        null;

    drawBoard();

}


/* =====================================================
   MUSIK KERAJAAN
===================================================== */

let audioContext =
    null;

let musicTimer =
    null;

let musicPlaying =
    false;


/*
   Melodi bergaya kerajaan.
*/

const melody = [

    392,440,494,523,

    587,523,494,440,

    392,440,494,587,

    659,587,523,494,

    523,587,659,784,

    659,587,523,440

];


function playRoyalNote(
    frequency,
    duration
){

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    osc.type =
        "triangle";


    osc.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        0,
        audioContext.currentTime
    );


    gain.gain.linearRampToValueAtTime(
        .08,
        audioContext.currentTime+.03
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+
        duration
    );


    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );


    osc.start();

    osc.stop(
        audioContext.currentTime+
        duration
    );

}


function startMusic(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(
        audioContext.state ===
        "s
