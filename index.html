<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Royal Chess — Check Edition</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

html{
    background:#111;
}

body{
    min-height:100vh;

    font-family:Georgia,serif;

    color:#fff;

    display:flex;
    justify-content:center;

    padding:3px 0 20px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #858585 0%,
            #555 28%,
            #292929 65%,
            #111 100%
        );

    overflow-x:hidden;
}

.game{
    width:100%;
    max-width:none;
    text-align:center;
}

/* =========================================================
   TITLE
========================================================= */

h1{
    font-size:clamp(28px,7vw,52px);

    margin:2px 0 0;

    color:#f5f5f5;

    letter-spacing:2px;

    text-shadow:
        0 4px 4px #000,
        0 0 15px rgba(255,255,255,.25);
}

.subtitle{
    color:#d8d8d8;

    font-size:clamp(10px,2.8vw,15px);

    margin-bottom:7px;
}

/* =========================================================
   MODE
========================================================= */

.mode-box{
    width:100%;

    margin:0 auto 7px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:7px;
    flex-wrap:wrap;
}

.mode-label{
    font-size:12px;
    color:#ccc;
    font-weight:bold;
}

.mode-select{
    padding:7px 11px;

    border:1px solid #777;
    border-radius:8px;

    background:linear-gradient(#555,#181818);

    color:#fff;

    font-family:Georgia,serif;
    font-weight:bold;

    cursor:pointer;
    outline:none;

    box-shadow:
        0 4px 10px rgba(0,0,0,.5);
}

.mode-select option{
    background:#222;
    color:#fff;
}

/* =========================================================
   BOARD
========================================================= */

.board{
    position:relative;

    width:100vw;
    height:100vw;

    margin:0 auto;

    display:grid;

    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);

    border:4px solid #0c0c0c;
    border-radius:8px;

    overflow:hidden;

    background:#111;

    box-shadow:
        0 18px 45px rgba(0,0,0,.9),
        0 4px 0 #777,
        0 0 28px rgba(0,0,0,.7);
}

@media(min-width:700px){

    .board{
        width:min(100vw,100vh);
        height:min(100vw,100vh);
    }

}

/* =========================================================
   SQUARE
========================================================= */

.square{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    overflow:hidden;

    user-select:none;

    touch-action:manipulation;

    -webkit-tap-highlight-color:transparent;
}

.light{
    background:
        linear-gradient(
            145deg,
            #fff 0%,
            #e4e4e4 45%,
            #cfcfcf 100%
        );
}

.dark{
    background:
        linear-gradient(
            145deg,
            #3b3b3b 0%,
            #202020 55%,
            #111 100%
        );
}

.square::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.07),
            transparent 40%,
            rgba(0,0,0,.12)
        );

    pointer-events:none;
}

/* =========================================================
   PIECE
========================================================= */

.piece{
    width:95%;
    height:95%;

    object-fit:contain;

    position:relative;
    z-index:5;

    pointer-events:none;

    transform-origin:center bottom;

    will-change:transform,filter;

    transition:
        transform .18s ease,
        filter .18s ease;
}

.white-piece{
    filter:
        drop-shadow(
            0 11px 5px
            rgba(0,0,0,.72)
        )
        drop-shadow(
            0 3px 2px
            rgba(0,0,0,.95)
        )
        brightness(1.08)
        contrast(1.08);
}

.black-piece{
    filter:
        drop-shadow(
            0 11px 6px
            rgba(0,0,0,.95)
        )
        drop-shadow(
            0 3px 2px
            rgba(0,0,0,1)
        )
        brightness(.76)
        contrast(1.18);
}

@media(hover:hover){

    .square.has-piece:hover .piece{
        transform:
            translateY(-5px)
            scale(1.04);
    }

}

/* =========================================================
   SELECTED
========================================================= */

.selected{
    box-shadow:
        inset 0 0 0 4px rgba(255,255,255,.95),
        inset 0 0 28px rgba(255,255,255,.3);
}

/* =========================================================
   POSSIBLE MOVE
========================================================= */

.possible::after{
    content:"";

    position:absolute;

    width:19%;
    height:19%;

    left:40.5%;
    top:40.5%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #777,
            #333
        );

    box-shadow:
        0 0 9px rgba(255,255,255,.8);

    z-index:3;
}

/* =========================================================
   CAPTURE TARGET
========================================================= */

.capture::after{
    content:"";

    position:absolute;

    inset:5px;

    border:
        4px solid
        rgba(255,255,255,.85);

    border-radius:50%;

    box-shadow:
        0 0 10px rgba(255,255,255,.25),
        inset 0 0 12px rgba(0,0,0,.35);

    z-index:3;
}

/* =========================================================
   CHECK
========================================================= */

.check{
    z-index:20;

    animation:
        checkFlash
        .55s
        infinite alternate;
}

.check::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,0,0,.08),
            rgba(255,0,0,.38)
        );

    z-index:4;
}

@keyframes checkFlash{

    from{
        box-shadow:
            inset 0 0 0 4px
            rgba(255,50,50,.65),

            inset 0 0 18px
            rgba(255,0,0,.25);
    }

    to{
        box-shadow:
            inset 0 0 0 8px
            rgba(255,0,0,1),

            inset 0 0 35px
            rgba(255,0,0,.55),

            0 0 15px
            rgba(255,0,0,.7);
    }

}

/* =========================================================
   CHECKMATE
========================================================= */

.checkmate-king{
    animation:
        checkmateFlash
        .4s
        infinite alternate;
}

@keyframes checkmateFlash{

    from{
        box-shadow:
            inset 0 0 0 5px
            rgba(255,0,0,.7),

            0 0 10px
            rgba(255,0,0,.4);
    }

    to{
        box-shadow:
            inset 0 0 0 10px
            rgba(255,0,0,1),

            0 0 35px
            rgba(255,0,0,.9);
    }

}

/* =========================================================
   FLYING PIECE
========================================================= */

.flying-piece{
    position:fixed;

    z-index:99999;

    pointer-events:none;

    object-fit:contain;

    transform-origin:center bottom;

    will-change:
        left,
        top,
        transform;

    transition:
        left .42s cubic-bezier(.2,.75,.25,1),
        top .42s cubic-bezier(.2,.75,.25,1),
        transform .42s cubic-bezier(.2,.75,.25,1);

    filter:
        drop-shadow(
            0 20px 10px
            rgba(0,0,0,.8)
        )
        drop-shadow(
            0 4px 2px
            rgba(0,0,0,1)
        );
}

.flying-piece-shadow{
    position:fixed;

    z-index:99998;

    pointer-events:none;

    border-radius:50%;

    background:rgba(0,0,0,.65);

    filter:blur(7px);

    transition:
        left .42s ease,
        top .42s ease,
        width .42s ease,
        opacity .42s ease;
}

.animating-source .piece{
    opacity:0;
}

.animating-source .fallback-piece{
    opacity:0;
}

/* =========================================================
   LANDING
========================================================= */

.landing{
    animation:
        realisticLanding
        .32s
        cubic-bezier(.18,.8,.2,1);
}

@keyframes realisticLanding{

    0%{
        transform:
            translateY(-12px)
            scale(1.06);
    }

    45%{
        transform:
            translateY(3px)
            scale(.96);
    }

    70%{
        transform:
            translateY(-2px)
            scale(1.02);
    }

    100%{
        transform:
            translateY(0)
            scale(1);
    }

}

/* =========================================================
   LANDING LIGHT
========================================================= */

.square.land-effect::after{
    content:"";

    position:absolute;

    width:80%;
    height:80%;

    left:10%;
    top:10%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.38),
            rgba(255,255,255,.12) 30%,
            transparent 72%
        );

    animation:
        landingGlow
        .5s
        ease-out;

    pointer-events:none;

    z-index:8;
}

@keyframes landingGlow{

    0%{
        transform:scale(.15);
        opacity:1;
    }

    100%{
        transform:scale(1.6);
        opacity:0;
    }

}

/* =========================================================
   CAPTURE EFFECT
========================================================= */

.square.capture-effect::before{
    content:"";

    position:absolute;

    width:30%;
    height:30%;

    left:35%;
    top:35%;

    border:
        3px solid
        rgba(255,255,255,.85);

    border-radius:50%;

    animation:
        capturePulse
        .4s
        ease-out;

    z-index:20;
}

@keyframes capturePulse{

    0%{
        transform:scale(.4);
        opacity:1;
    }

    100%{
        transform:scale(2.8);
        opacity:0;
    }

}

/* =========================================================
   STATUS
========================================================= */

.info{
    width:100%;

    margin:8px auto 0;

    padding:10px;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #5c5c5c,
            #242424
        );

    border:1px solid #707070;

    box-shadow:
        0 8px 20px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.1);
}

#status{
    font-size:clamp(13px,4vw,18px);

    font-weight:bold;

    color:#f5f5f5;

    text-shadow:
        0 2px 2px #000;

    min-height:22px;
}

#checkBanner{
    margin-top:5px;

    font-size:clamp(11px,3vw,14px);

    font-weight:bold;

    color:#ffb0b0;

    min-height:16px;

    text-shadow:
        0 1px 2px #000;
}

/* =========================================================
   BUTTONS
========================================================= */

.buttons{
    width:100%;

    margin:8px auto 0;

    display:flex;

    justify-content:center;

    gap:6px;

    flex-wrap:wrap;
}

button{
    padding:8px 13px;

    border:1px solid #707070;

    border-radius:8px;

    background:
        linear-gradient(
            #5c5c5c,
            #191919
        );

    color:white;

    font-size:clamp(11px,3vw,14px);

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 12px rgba(0,0,0,.5);

    transition:
        transform .15s ease,
        filter .15s ease;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.18);
}

button:active{
    transform:scale(.94);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    margin-top:8px;

    color:#aaa;

    font-size:10px;
}

/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .landing,
    .check,
    .checkmate-king{
        animation:none;
    }

    .flying-piece,
    .flying-piece-shadow{
        transition:none;
    }

}

</style>

</head>

<body>

<div class="game">

    <h1>♛ ROYAL CHESS</h1>

    <p class="subtitle">
        Catur • Animasi Bidak • Sistem SKAK
    </p>

    <div class="mode-box">

        <span class="mode-label">
            Mode:
        </span>

        <select
            id="modeSelect"
            class="mode-select"
        >

            <option value="computer">
                🤖 Kamu vs Komputer
            </option>

            <option value="two">
                👥 2 Pemain
            </option>

        </select>

    </div>

    <div
        id="board"
        class="board"
    ></div>

    <div class="info">

        <div id="status">
            ♟ Giliran Kamu
        </div>

        <div id="checkBanner"></div>

    </div>

    <div class="buttons">

        <button id="newGameBtn">
            🔄 Game Baru
        </button>

        <button id="undoBtn">
            ↩️ Undo
        </button>

    </div>

    <p class="footer">
        Royal Chess • PV2 • Check System
    </p>

</div>

<script>

/* =========================================================
   CHESS ENGINE CHECK
========================================================= */

if(typeof Chess === "undefined"){

    document.body.innerHTML = `
        <h2 style="
            color:white;
            text-align:center;
            padding:30px;
            font-family:Georgia,serif;
        ">
            Chess engine gagal dimuat.<br>
            Periksa koneksi internet lalu refresh halaman.
        </h2>
    `;

    throw new Error("Chess.js gagal dimuat.");
}


/* =========================================================
   ENGINE
========================================================= */

const game = new Chess();


/* =========================================================
   ELEMENTS
========================================================= */

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const checkBanner =
    document.getElementById("checkBanner");

const newGameBtn =
    document.getElementById("newGameBtn");

const undoBtn =
    document.getElementById("undoBtn");

const modeSelect =
    document.getElementById("modeSelect");


/* =========================================================
   STATE
========================================================= */

let selectedSquare = null;

let thinking = false;

let animating = false;

let computerTimer = null;


/* =========================================================
   MODE
========================================================= */

function isComputerMode(){

    return modeSelect.value === "computer";

}


/* =========================================================
   PIECE IMAGES
========================================================= */

const pieceImages = {

    w:{

        k:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_klt45.svg",
        q:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_qlt45.svg",
        r:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_rlt45.svg",
        b:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_blt45.svg",
        n:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_nlt45.svg",
        p:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_plt45.svg"

    },

    b:{

        k:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_kdt45.svg",
        q:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_qdt45.svg",
        r:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_rdt45.svg",
        b:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_bdt45.svg",
        n:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_ndt45.svg",
        p:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Chess_pdt45.svg"

    }

};


/* =========================================================
   FALLBACK SYMBOL
========================================================= */

const symbols = {

    wk:"♔",
    wq:"♕",
    wr:"♖",
    wb:"♗",
    wn:"♘",
    wp:"♙",

    bk:"♚",
    bq:"♛",
    br:"♜",
    bb:"♝",
    bn:"♞",
    bp:"♟"

};


/* =========================================================
   GET SQUARE ELEMENT
========================================================= */

function getSquareElement(square){

    return document.querySelector(
        `[data-square="${square}"]`
    );

}


/* =========================================================
   CREATE PIECE
========================================================= */

function createPiece(square,piece){

    const img =
        document.createElement("img");

    img.className =
        "piece " +
        (
            piece.color === "w"
            ? "white-piece"
            : "black-piece"
        );

    img.src =
        pieceImages[piece.color][piece.type];

    img.alt =
        piece.color + piece.type;

    img.draggable = false;

    img.onerror = function(){

        this.style.display = "none";

        const fallback =
            document.createElement("span");

        fallback.className =
            "fallback-piece";

        fallback.textContent =
            symbols[
                piece.color + piece.type
            ];

        fallback.style.fontSize = "80%";
        fallback.style.lineHeight = "1";
        fallback.style.position = "relative";
        fallback.style.zIndex = "5";

        fallback.style.color =
            piece.color === "w"
            ? "#fff"
            : "#050505";

        fallback.style.textShadow =
            piece.color === "w"
            ? "0 4px 4px #000"
            : "0 4px 4px #777";

        square.appendChild(fallback);

    };

    square.appendChild(img);

}


/* =========================================================
   RENDER BOARD
========================================================= */

function renderBoard(){

    boardElement.innerHTML = "";

    const position =
        game.board();

    for(let row=0;row<8;row++){

        for(let col=0;col<8;col++){

            const square =
                document.createElement("div");

            const file =
                String.fromCharCode(97 + col);

            const rank =
                8 - row;

            const squareName =
                file + rank;

            square.className =
                "square " +
                (
                    (row + col) % 2 === 0
                    ? "light"
                    : "dark"
                );

            square.dataset.square =
                squareName;

            const piece =
                position[row][col];

            if(piece){

                square.classList.add(
                    "has-piece"
                );

                createPiece(
                    square,
                    piece
                );

            }

            square.addEventListener(
                "click",
                () => handleSquareClick(squareName)
            );

            boardElement.appendChild(square);

        }

    }

    highlightBoard();

}


/* =========================================================
   FIND KING
========================================================= */

function findKingSquare(color){

    const position =
        game.board();

    for(let row=0;row<8;row++){

        for(let col=0;col<8;col++){

            const piece =
                position[row][col];

            if(
                piece &&
                piece.type === "k" &&
                piece.color === color
            ){

                return (
                    String.fromCharCode(97 + col) +
                    (8 - row)
                );

            }

        }

    }

    return null;

}


/* =========================================================
   HIGHLIGHT BOARD
========================================================= */

function highlightBoard(){

    document
        .querySelectorAll(".square")
        .forEach(square => {

            square.classList.remove(
                "selected",
                "possible",
                "capture",
                "check",
                "checkmate-king"
            );

        });


    /* SELECTED */

    if(selectedSquare){

        const selected =
            getSquareElement(selectedSquare);

        if(selected){

            selected.classList.add(
                "selected"
            );

        }

        const moves =
            game.moves({
                square:selectedSquare,
                verbose:true
            });

        moves.forEach(move => {

            const target =
                getSquareElement(move.to);

            if(!target){
                return;
            }

            if(move.captured){

                target.classList.add(
                    "capture"
                );

            }else{

                target.classList.add(
                    "possible"
                );

            }

        });

    }


    /* CHECK */

    if(game.in_check()){

        const kingSquare =
            findKingSquare(game.turn());

        if(!kingSquare){
            return;
        }

        const kingElement =
            getSquareElement(kingSquare);

        if(!kingElement){
            return;
        }

        kingElement.classList.add("check");

        if(game.is_checkmate()){

            kingElement.classList.add(
                "checkmate-king"
            );

        }

    }

}


/* =========================================================
   PLAYER CLICK
========================================================= */

function handleSquareClick(square){

    if(
        thinking ||
        animating ||
        game.game_over()
    ){

        return;

    }

    if(
        isComputerMode() &&
        game.turn() !== "w"
    ){

        return;

    }


    /* FIRST SELECTION */

    if(!selectedSquare){

        const piece =
            game.get(square);

        if(!piece){
            return;
        }

        if(
            piece.color !== game.turn()
        ){

            return;

        }

        if(
            isComputerMode() &&
            piece.color !== "w"
        ){

            return;

        }

        selectedSquare =
            square;

        highlightBoard();

        return;

    }


    /* RESELECT OWN PIECE */

    const clickedPiece =
        game.get(square);

    if(
        clickedPiece &&
        clickedPiece.color === game.turn()
    ){

        selectedSquare =
            square;

        highlightBoard();

        return;

    }


    /* CHECK LEGAL MOVE */

    const moves =
        game.moves({
            square:selectedSquare,
            verbose:true
        });

    const legalMove =
        moves.find(
            move => move.to === square
        );

    if(!legalMove){

        selectedSquare = null;

        highlightBoard();

        return;

    }


    const from =
        selectedSquare;

    const to =
        square;

    selectedSquare = null;


    animatePhysicalMove(
        from,
        to,
        () => {

            const move =
                game.move({
                    from,
                    to,
                    promotion:"q"
                });

            if(!move){

                renderBoard();
                updateStatus();

                return;

            }

            renderBoard();
            updateStatus();


            if(
                isComputerMode() &&
                !game.game_over() &&
                game.turn() === "b"
            ){

                thinking = true;

                updateStatus();

                computerTimer =
                    setTimeout(
                        computerMove,
                        450
                    );

            }

        }
    );

}


/* =========================================================
   PHYSICAL MOVE ANIMATION
========================================================= */

function animatePhysicalMove(
    from,
    to,
    callback
){

    const fromSquare =
        getSquareElement(from);

    const toSquare =
        getSquareElement(to);

    if(
        !fromSquare ||
        !toSquare
    ){

        callback();
        return;

    }


    const piece =
        fromSquare.querySelector(".piece");


    if(!piece){

        callback();
        return;

    }


    animating = true;


    const start =
        fromSquare.getBoundingClientRect();

    const end =
        toSquare.getBoundingClientRect();


    const clone =
        piece.cloneNode(true);

    clone.classList.remove("piece");

    clone.classList.add(
        "flying-piece"
    );


    const size =
        Math.min(
            start.width,
            start.height
        ) * .92;


    clone.style.width =
        size + "px";

    clone.style.height =
        size + "px";


    const startLeft =
        start.left +
        (start.width - size) / 2;

    const startTop =
        start.top +
        (start.height - size) / 2;

    const endLeft =
        end.left +
        (end.width - size) / 2;

    const endTop =
        end.top +
        (end.height - size) / 2;


    clone.style.left =
        startLeft + "px";

    clone.style.top =
        startTop + "px";


    const shadow =
        document.createElement("div");

    shadow.className =
        "flying-piece-shadow";


    const shadowWidth =
        size * .5;


    shadow.style.width =
        shadowWidth + "px";

    shadow.style.height =
        size * .14 + "px";

    shadow.style.left =
        (
            start.left +
            start.width / 2 -
            shadowWidth / 2
        ) + "px";

    shadow.style.top =
        (
            start.top +
            start.height * .79
        ) + "px";

    shadow.style.opacity =
        ".72";


    document.body.appendChild(shadow);
    document.body.appendChild(clone);


    fromSquare.classList.add(
        "animating-source"
    );


    const captured =
        toSquare.querySelector(
            ".piece, .fallback-piece"
        );


    if(captured){

        captured.style.opacity = "0";

    }


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            clone.style.left =
                endLeft + "px";

            clone.style.top =
                endTop + "px";

            clone.style.transform =
                "translateY(-28px) scale(1.06)";


            shadow.style.left =
                (
                    end.left +
                    end.width / 2 -
                    size * .20
                ) + "px";

            shadow.style.top =
                (
                    end.top +
                    end.height * .80
                ) + "px";

            shadow.style.width =
                size * .40 + "px";

            shadow.style.opacity =
                ".35";

        });

    });


    setTimeout(() => {

        clone.style.transform =
            "translateY(-36px) scale(1.08)";

    },180);


    setTimeout(() => {

        clone.style.transform =
            "translateY(0) scale(.98)";

    },390);


    setTimeout(() => {

        clone.remove();
        shadow.remove();

        fromSquare.classList.remove(
            "animating-source"
        );


        if(captured){

            toSquare.classList.add(
                "capture-effect"
            );

            setTimeout(() => {

                toSquare.classList.remove(
                    "capture-effect"
                );

            },450);

        }


        toSquare.classList.add(
            "landing",
            "land-effect"
        );


        setTimeout(() => {

            toSquare.classList.remove(
                "landing",
                "land-effect"
            );

        },500);


        animating = false;

        callback();

    },540);

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    /* CHECKMATE */

    if(game.is_checkmate()){

        statusElement.textContent =
            game.turn() === "w"
            ? "♚ SKAKMAT — Hitam Menang"
            : "♔ SKAKMAT — Putih Menang";

        checkBanner.textContent =
            "💀 Raja tidak memiliki langkah legal.";

        highlightBoard();

        return;

    }


    /* STALEMATE */

    if(game.is_stalemate()){

        statusElement.textContent =
            "🤝 REMIS — Stalemate";

        checkBanner.textContent =
            "Tidak ada langkah legal.";

        highlightBoard();

        return;

    }


    /* DRAW */

    if(game.is_draw()){

        statusElement.textContent =
            "🤝 PERMAINAN REMIS";

        checkBanner.textContent =
            "Permainan berakhir seri.";

        highlightBoard();

        return;

    }


    /* CHECK */

    if(game.in_check()){

        if(game.turn() === "w"){

            statusElement.textContent =
                "⚠️ SKAK! Giliran Putih";

            checkBanner.textContent =
                "♔ RAJA PUTIH SEDANG TERANCAM!";

        }else{

            statusElement.textContent =
                "⚠️ SKAK! Giliran Hitam";

            checkBanner.textContent =
                "♚ RAJA HITAM SEDANG TERANCAM!";

        }

        highlightBoard();

        return;

    }


    /* COMPUTER THINKING */

    if(thinking){

        statusElement.textContent =
            "♚ Komputer sedang berpikir...";

        checkBanner.textContent = "";

        return;

    }


    /* NORMAL */

    checkBanner.textContent = "";


    if(isComputerMode()){

        statusElement.textContent =
            game.turn() === "w"
            ? "♟ Giliran Kamu"
            : "♚ Giliran Komputer";

    }else{

        statusElement.textContent =
            game.turn() === "w"
            ? "♔ Giliran Pemain Putih"
            : "♚ Giliran Pemain Hitam";

    }


    highlightBoard();

}


/* =========================================================
   AI
========================================================= */

const pieceValue = {

    p:100,
    n:320,
    b:330,
    r:500,
    q:900,
    k:20000

};


/* =========================================================
   POSITION BONUS
========================================================= */

const centerBonus = [

    [0,0,0,0,0,0,0,0],
    [0,5,5,5,5,5,5,0],
    [0,5,10,15,15,10,5,0],
    [0,5,15,20,20,15,5,0],
    [0,5,15,20,20,15,5,0],
    [0,5,10,15,15,10,5,0],
    [0,5,5,5,5,5,5,0],
    [0,0,0,0,0,0,0,0]

];


/* =========================================================
   EVALUATE
========================================================= */

function evaluateBoard(){

    if(game.is_checkmate()){

        return game.turn() === "b"
            ? -1000000
            : 1000000;

    }


    if(
        game.is_stalemate() ||
        game.is_draw()
    ){

        return 0;

    }


    let score = 0;

    const board =
        game.board();


    for(let row=0;row<8;row++){

        for(let col=0;col<8;col++){

            const piece =
                board[row][col];

            if(!piece){
                continue;
            }


            let value =
                pieceValue[piece.type];


            /* Center control */

            if(piece.type !== "k"){

                value +=
                    centerBonus[row][col];

            }


            /* Pawn advancement */

            if(piece.type === "p"){

                if(piece.color === "b"){

                    value +=
                        (row - 1) * 3;

                }else{

                    value +=
                        (6 - row) * 3;

                }

            }


            if(piece.color === "b"){

                score += value;

            }else{

                score -= value;

            }

        }

    }


    /* Mobility */

    const mobility =
        game.moves().length;

    score +=
        game.turn() === "b"
        ? mobility * 2
        : mobility * -2;


    return score;

}


/* =========================================================
   MINIMAX
========================================================= */

function minimax(
    depth,
    alpha,
    beta,
    maximizing
){

    if(
        depth === 0 ||
        game.game_over()
    ){

        return evaluateBoard();

    }


    const moves =
        game.moves();

    if(!moves.length){

        return evaluateBoard();

    }


    if(maximizing){

        let best =
            -Infinity;


        for(const move of moves){

            game.move(move);

            const score =
                minimax(
                    depth - 1,
                    alpha,
                    beta,
                    false
                );

            game.undo();


            best =
                Math.max(
                    best,
                    score
                );

            alpha =
                Math.max(
                    alpha,
                    best
                );


            if(beta <= alpha){
                break;
            }

        }

        return best;

    }


    let best =
        Infinity;


    for(const move of moves){

        game.move(move);

        const score =
            minimax(
                depth - 1,
                alpha,
                beta,
                true
            );

        game.undo();


        best =
            Math.min(
                best,
                score
            );

        beta =
            Math.min(
                beta,
                best
            );


        if(beta <= alpha){
            break;
        }

    }


    return best;

}


/* =========================================================
   MOVE ORDERING
========================================================= */

function orderMoves(moves){

    return moves.sort(
        (a,b) => {

            const scoreA =
                (a.captured
                    ? pieceValue[a.captured]
                    : 0) +
                (a.promotion
                    ? 800
                    : 0);

            const scoreB =
                (b.captured
                    ? pieceValue[b.captured]
                    : 0) +
                (b.promotion
                    ? 800
                    : 0);

            return scoreB - scoreA;

        }
    );

}


/* =========================================================
   COMPUTER MOVE
========================================================= */

function computerMove(){

    computerTimer = null;


    if(
        !isComputerMode() ||
        game.game_over() ||
        game.turn() !== "b"
    ){

        thinking = false;
        updateStatus();

        return;

    }


    thinking = true;
    updateStatus();


    let moves =
        game.moves({
            verbose:true
        });


    if(!moves.length){

        thinking = false;
        updateStatus();

        return;

    }


    moves =
        orderMoves(moves);


    let bestMove =
        moves[0];

    let bestScore =
        -Infinity;


    /*
       Depth 2 total:
       komputer -> pemain -> evaluasi
    */

    for(const move of moves){

        game.move({
            from:move.from,
            to:move.to,
            promotion:
                move.promotion || "q"
        });


        const score =
            minimax(
                1,
                -Infinity,
                Infinity,
                false
            );


        game.undo();


        /*
           Random kecil di antara
           langkah dengan skor sama
           agar AI tidak selalu kaku.
        */

        if(score > bestScore){

            bestScore = score;
            bestMove = move;

        }

    }


    computerTimer =
        setTimeout(() => {

            computerTimer = null;


            if(
                !isComputerMode() ||
                game.game_over() ||
                game.turn() !== "b"
            ){

                thinking = false;
                updateStatus();

                return;

            }


            animatePhysicalMove(
                bestMove.from,
                bestMove.to,
                () => {

                    const move =
                        game.move({
                            from:bestMove.from,
                            to:bestMove.to,
                            promotion:
                                bestMove.promotion ||
                                "q"
                        });


                    if(!move){

                        thinking = false;

                        renderBoard();
                        updateStatus();

                        return;

                    }


                    renderBoard();

                    thinking = false;

                    updateStatus();

                }
            );

        },300);

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    if(computerTimer){

        clearTimeout(
            computerTimer
        );

        computerTimer = null;

    }


    game.reset();

    selectedSquare = null;

    thinking = false;

    animating = false;


    renderBoard();
    updateStatus();

}


/* =========================================================
   UNDO
========================================================= */

function undoMove(){

    if(
        thinking ||
        animating
    ){

        return;

    }


    if(computerTimer){

        clearTimeout(
            computerTimer
        );

        computerTimer = null;

    }


    const history =
        game.history();


    if(!history.length){

        return;

    }


    /*
       MODE KOMPUTER

       Setelah komputer selesai,
       posisi normalnya kembali ke
       giliran Putih.

       Jadi undo dua langkah:
       komputer + pemain.

       Jika hanya ada satu langkah,
       undo satu saja.
    */

    if(isComputerMode()){

        if(game.turn() === "w"){

            game.undo();

            if(game.history().length > 0){

                game.undo();

            }

        }else{

            game.undo();

        }

    }else{

        game.undo();

    }


    selectedSquare = null;

    thinking = false;

    animating = false;


    renderBoard();
    updateStatus();

}


/* =========================================================
   CHANGE MODE
========================================================= */

function changeMode(){

    if(computerTimer){

        clearTimeout(
            computerTimer
        );

        computerTimer = null;

    }


    game.reset();

    selectedSquare = null;

    thinking = false;

    animating = false;


    renderBoard();
    updateStatus();

}


/* =========================================================
   EVENTS
========================================================= */

newGameBtn.addEventListener(
    "click",
    newGame
);

undoBtn.addEventListener(
    "click",
    undoMove
);

modeSelect.addEventListener(
    "change",
    changeMode
);


/* =========================================================
   START
========================================================= */

renderBoard();

updateStatus();

</script>
