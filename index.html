<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #4b1675, transparent 45%),
        linear-gradient(135deg, #17102d, #30145c, #120b22);
      color: white;
    }

    .game {
      width: 100%;
      max-width: 500px;
      padding: 25px;
      text-align: center;
      background: rgba(20, 15, 35, 0.96);
      border: 2px solid #7040a0;
      border-radius: 25px;
      box-shadow:
        0 0 25px rgba(180, 80, 255, .35),
        0 20px 50px rgba(0,0,0,.5);
    }

    h1 {
      margin: 0;
      color: #ffd84d;
      font-size: 34px;
      text-shadow:
        0 0 10px #ff9800,
        0 0 25px #ff9800;
    }

    .subtitle {
      margin-top: 5px;
      color: #aaa;
      font-size: 12px;
    }

    .credits {
      margin: 20px 0;
      padding: 12px;
      border-radius: 12px;
      background: #0d0917;
      border: 1px solid #ffffff15;
      font-size: 20px;
    }

    .credits strong {
      color: #ffd84d;
    }

    .machine {
      position: relative;
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 15px;
      margin: 20px 0;
      background: #08060d;
      border: 3px solid #5d3780;
      border-radius: 20px;
      box-shadow:
        inset 0 0 25px #000,
        0 0 15px rgba(180,80,255,.25);
    }

    .machine::after {
      content: "";
      position: absolute;
      left: 5%;
      right: 5%;
      top: 50%;
      height: 3px;
      background: #ff3ca6;
      box-shadow: 0 0 12px #ff3ca6;
      pointer-events: none;
    }

    .reel {
